
plugins {
    id 'maven-publish'
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.1.7"
    id 'net.neoforged.moddev' version '2.0.107'
}

group = 'net.abraxator.moresnifferflowers'
version = version

base {
    archivesName.set("MoreSnifferFlowers-${minecraft_version}-neo")
}

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        url "https://cursemaven.com"
    }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://maven.blamejared.com/" }
    maven { url = "https://modmaven.dev" }
    maven {
        name 'Shedaniel\'s Maven' //REI
        url "https://maven.shedaniel.me"
    }
    maven {
        name = "TerraformersMC" //EMI
        url = "https://maven.terraformersmc.com/"
    }
    flatDir { dir 'libs' }
}


java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = project.neoforge_version
    validateAccessTransformers = true

    runs {
        configureEach {
            gameDirectory = layout.projectDir.dir("runs/$name")
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            }
            client {
                client()
            }
            clientAuth {
                client()
                devLogin = true
                gameDirectory = layout.projectDir.dir("runs/client")
            }
            data {
                data()
                programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            }
            server {
                server()
                programArgument('--nogui')
            }
        }
        mods {
            more_sniffer_flowers {
                sourceSet(sourceSets.main)
            }
        }
    }

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    compileOnly("curse.maven:rightclickharvest-452834:6134804")

    runtimeOnly "curse.maven:farmers-delight-398521:6917256"
    compileOnly "curse.maven:farmers-delight-398521:6917256"

    jarJar(implementation(group: "maven.modrinth", name:"tiny-multiblock-lib", version:"neo-1.21.1-2.0"){
        version {
            strictly('[neo-1.21.1-2.0,)')
        }
    })

    runtimeOnly("curse.maven:carry-on-274259:5649344")

    implementation("maven.modrinth:dye-depot:2.0.1-neoforge")

    implementation("net.neoforged:neoforge:${neoforge_version}")
}

final manifestAttributes = [
        'Specification-Title'   : 'More Sniffer Flowers',
        'Specification-Vendor'  : 'Nikdo53',
        'Specification-Version' : project.version,
        'Implementation-Title'  : project.name,
        'Implementation-Version': project.jar.archiveVersion,
        'Implementation-Vendor' : 'Nikdo53',
        "MixinConfigs": "more_sniffer_flowers.neoforge.mixins.json"
]

jar {
    manifest.attributes(manifestAttributes)
//    finalizedBy('reobfJar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}