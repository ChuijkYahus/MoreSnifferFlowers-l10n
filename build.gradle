
plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.115'
    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}

group = 'net.abraxator.moresnifferflowers'
base {
    archivesName.set("MoreSnifferFlowers-${minecraft_version}-Forge")
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                url = "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { url = "https://maven.blamejared.com/" }
    maven { url = "https://modmaven.dev" }
    maven {
        name 'Shedaniel\'s Maven' //REI
        url "https://maven.shedaniel.me"
    }
    maven {
        name = "TerraformersMC" //EMI
        url = "https://maven.terraformersmc.com/"
    }
    flatDir { dir 'libs' }

}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"


    legacyForge {
        version = project.minecraft_version+'-'+forge_version

        parchment {
            mappingsVersion = project.parchment_mappings_version
            minecraftVersion = project.minecraft_version
        }

        runs {
            configureEach {
                gameDirectory = layout.projectDir.dir("runs/$name")
                systemProperty 'forge.logging.console.level', 'debug'
                systemProperty 'forge.logging.markers', 'REGISTRIES'

            }
            client {
                client()
            }
            clientAuth {
                client()
                devLogin = true
                gameDirectory = layout.projectDir.dir("runs/client")
            }
            data {
                data()
                programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            }
            server {
                server()
                programArgument('--nogui')
            }
        }
        mods {
            more_sniffer_flowers {
                sourceSet(sourceSets.main)
            }
        }
    }

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation 'org.jetbrains:annotations:26.0.1'

    //jei
    modCompileOnlyApi("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    modCompileOnlyApi("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    // Sometimes JEI disappears for some reason
     modRuntimeOnly("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
   // modRuntimeOnly("curse.maven:jei-238222:6075247")

    //mixin
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:[0.5.0,)"))
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))

    // modImplementation(jarJar(group: "local", name:"tiny-multiblock-lib-forge-1.20.1", version: "[2.0,)"))
    // modImplementation("maven.modrinth:tiny-multiblock-lib:forge-1.20.1-2.0")
    modImplementation(jarJar("maven.modrinth:tiny-multiblock-lib:forge-1.20.1-${tiny_multiblock_lib_version}"))

    //quark
    compileOnly("curse.maven:quark-243121:6427817")
    compileOnly("curse.maven:zeta-968868:6432578")

    //farmersDelight
    modRuntimeOnly("curse.maven:farmers-delight-398521:6917255");
    modCompileOnly("curse.maven:farmers-delight-398521:6917255");

    //BotanyPots
/*
    modImplementation(group: 'net.darkhax.botanypots', name: 'BotanyPots-Forge-1.20.1', version: '13.0.41')
    modImplementation(group: 'net.darkhax.bookshelf', name: 'Bookshelf-Forge-1.20.1', version: '20.2.13')

    modImplementation("curse.maven:daves-potioneering-639653:6727871")
    modImplementation("curse.maven:geckolib-388172:7025129")
*/

    // modImplementation("maven.modrinth:dye-depot:1.2.1-forge")
    // modImplementation("curse.maven:worldedit-225608:4586218")
}

mixin {
    add sourceSets.main, 'more_sniffer_flowers.mixins.refmap.json'
    config 'more_sniffer_flowers.mixins.json'
}

final manifestAttributes = [
        'Specification-Title'   : 'MoreSnifferFlowers',
        'Specification-Vendor'  : 'Nikdo53',
        'Specification-Version' : '1',
        'Implementation-Title'  : project.name,
        'Implementation-Version': project.version,
        'Implementation-Vendor' : 'Nikdo53',
        "MixinConfigs"          : "more_sniffer_flowers.mixins.json",
        'jei_version'           : project.jei_version_range,
]

jar {
    manifest.attributes(manifestAttributes)
    finalizedBy('reobfJar')
}

publishMods {
    file = jar.archiveFile
    modLoaders.add("forge")
    displayName = "More Sniffer Flowers $version - $minecraft_version Forge"

    type = STABLE
    changelog = rootProject.file("CHANGELOG.md").text

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        projectId = "884119"
        minecraftVersions.add(minecraft_version)
    }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "DbriYWc8"
        minecraftVersions.add(minecraft_version)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}